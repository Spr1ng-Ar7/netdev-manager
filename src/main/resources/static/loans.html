<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>借出归还 - 网络设备管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="content">
            <div class="card">
                <div class="toolbar">
                    <select class="select" id="f-status">
                        <option value="">全部状态</option>
                        <option value="PENDING">待审批</option>
                        <option value="APPROVED">已借出</option>
                        <option value="RETURNED">已归还</option>
                        <option value="REJECTED">已驳回</option>
                    </select>
                    <button class="btn" onclick="loadList(1)">查询</button>
                    <div class="spacer"></div>
                    <button class="btn btn-green" onclick="openApplyForm()">＋ 提交借出申请</button>
                </div>
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th>单号</th><th>设备</th><th>借用人</th><th>用途</th><th>申请人</th>
                            <th>预计归还</th><th>状态</th><th>实际归还</th><th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                <div class="pagination" id="pager"></div>
            </div>
        </main>
    </div>
</div>
<script src="js/common.js"></script>
<script src="js/loans.js"></script>
</body>
</html>
