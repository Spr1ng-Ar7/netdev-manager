<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 网络设备管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="content">
            <div class="card">
                <div class="toolbar">
                    <input class="input" id="f-keyword" placeholder="搜索姓名/用户名…" style="width:220px">
                    <button class="btn" onclick="loadList()">查询</button>
                    <div class="spacer"></div>
                    <button class="btn btn-green" id="btn-add" style="display:none" onclick="openForm()">＋ 新增用户</button>
                </div>
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th>用户名</th><th>姓名</th><th>角色</th><th>电话</th><th>邮箱</th>
                            <th>状态</th><th>创建时间</th><th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="js/common.js"></script>
<script src="js/users.js"></script>
</body>
</html>
