server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/netdev_db?useUnicode=true&characterEncoding=utf8&useSSL=false}
    username: ${DB_USERNAME:netdev}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

app:
  upload-dir: uploads

logging:
  level:
    root: info
